name: Build PlayerServerCore plugin
run-name: Build PlayerServerCore plugin
on: [push]
jobs:
    Build-latest-jar:
        runs-on: ubuntu-latest
        steps:
            - name: Build | Prepare packages
              run: |
                  apt-get update
                  apt-get install software-properties-common -y 
                  add-apt-repository universe
                  apt-get install -y openjdk-21-jdk maven
            - name: Prepare | Setup git
              run: |
                  git config --global user.name "Radim Lipovčan"
                  git config --global user.email "radim@lipovcan.cz"
            - name: Check out repository code
              uses: actions/checkout@v3
            - name: Build | Maven build
              run: |
                  ls -lah
                  mvn clean install && ls -lah && ls */ -lah && ls */* -lah&& ls */*/* -lah
            - name: Build | publish jar
              run:  |
                  curl --insecure --user username:mypass -T target/PlayerServerCore-1.0.jar ftp://192.168.10.133:/